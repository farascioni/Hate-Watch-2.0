# Hate Watch API on Fly.io. Deploy from this folder: fly deploy --remote-only (the very first deploy, which creates
# the machine, was fly deploy --ha=false, so there is exactly one; later deploys keep it: README "Server → Fly.io").
# App names are global on Fly: if "hate-watch-api" is taken, change it here and everywhere the host is named: app/eas.json
# (preview and production), app/package.json's update script, app/src/lib/api.ts's fallback, app/app.json's
# associatedDomains, and the server's own public URL (HW_PUBLIC_URL, fanout.ts). README "If you rename the Fly app".
app = "hate-watch-api"
primary_region = "iad"   # US East: closest to ESPN's API and most US users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HW_DB = "/data/hatewatch.db"
  HW_CONTACT_EMAIL = "hatewatchfeedback@gmail.com"   # shown publicly on /privacy and /support
  # HW_DEV must stay unset in production (it enables /dev/simulate).

[http_service]
  internal_port = 8080
  force_https = true
  # The live-game poller and every open WebSocket run inside this one process.
  # It must never be stopped for idleness, and there must be exactly one machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"     # each open app holds one WebSocket
    soft_limit = 2000
    hard_limit = 2500

[[http_service.checks]]
  # First boot downloads ~7,000 players and verifies every image before listening: about 30-60s here (16s measured
  # on a laptop); the grace period below covers it.
  grace_period = "120s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[mounts]]
  source = "hatewatch_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  # One machine + one volume: replace it in place (a few seconds of downtime per deploy).
  strategy = "immediate"
